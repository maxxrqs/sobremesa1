name: APK Android
on:
  push:
    branches: [android]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/release/*.apk /tmp/out/sobremesa-unsigned.apk
          cd /tmp/out && git init -q -b android-out && git add . && git -c user.name=ci -c user.email=ci@local commit -qm "APK non signé ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-out
