name: APK Android
on:
  push:
    branches: [android]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew && (./gradlew --no-daemon assembleRelease 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]})
        shell: bash
        continue-on-error: true
      - run: |
          mkdir -p /tmp/out && cp /tmp/build.log /tmp/out/ && BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1) && cp $BT/lib/apksigner.jar $BT/zipalign /tmp/out/ && (cp app/build/outputs/apk/release/*.apk /tmp/out/sobremesa-unsigned.apk || true)
          cd /tmp/out && git init -q -b android-out && git add . && git -c user.name=ci -c user.email=ci@local commit -qm "APK non signé ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-out
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: android-out }
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: |
          keytool -genkeypair -keystore t.ks -alias t -keyalg RSA -validity 100 -storepass testtest -keypass testtest -dname CN=t
          java -jar apksigner.jar sign --ks t.ks --ks-pass pass:testtest --out t.apk sobremesa-unsigned.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r t.apk
            adb logcat -c
            adb shell monkey -p io.github.maxxrqs.sobremesa -c android.intent.category.LAUNCHER 1 ; sleep 25
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > /tmp/act.txt || true
            adb logcat -d > /tmp/logcat.txt ; adb exec-out screencap -p > /tmp/screen.png
      - if: always()
        run: |
          mkdir -p /tmp/t && cp /tmp/logcat.txt /tmp/screen.png /tmp/act.txt /tmp/t/ 2>/dev/null || true
          cd /tmp/t && git init -q -b android-test && git add . && git -c user.name=ci -c user.email=ci@local commit -qm test && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-test
