name: Clips audio manquants
on:
  push:
    branches: [audio-gen]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
      - run: pip install -q kokoro-onnx soundfile numpy
      - run: |
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python gen_kokoro.py 2>&1 | tee out_log.txt
        continue-on-error: true
      - if: always()
        run: |
          mkdir -p out && cp out_log.txt out/ || true
          cd out && git init -q -b audio-out && git add . && git -c user.name=ci -c user.email=ci@local commit -qm "clips ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" audio-out
